name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build, Typecheck, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Testcontainers manages its own Postgres containers via Docker.
    # ubuntu-latest has Docker pre-installed — no service container needed.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (dependency order)
        run: pnpm -r build

      # Glob filters so new packages/examples are covered automatically —
      # every package has a `typecheck` script; examples are checked via tsc.
      - name: Typecheck packages
        run: pnpm --filter "./packages/*" typecheck

      - name: Typecheck examples
        run: pnpm --filter "./examples/*" exec tsc --noEmit

      - name: Test packages
        run: pnpm --filter "./packages/*" test

      - name: Test examples
        run: pnpm --filter "./examples/*" test
